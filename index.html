<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A classic Snake Game built with HTML, CSS and JavaScript.">

    <title>Snake Game</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <h1>Snake Game</h1>
            <p>Eat the food. Grow longer. Avoid collisions!</p>
        </header>

        <section class="score-container">

            <div class="score-card">
                <h2>Score</h2>
                <p id="score">0</p>
            </div>

            <div class="score-card">
                <h2>High Score</h2>
                <p id="high-score">0</p>
            </div>

        </section>

        <section class="game-section">

            <div class="game-status" id="game-status">
                Press Start to Play
            </div>

            <canvas id="game-board" width="400" height="400" aria-label="Snake game board"></canvas>

        </section>

        <section class="game-controls">

            <button id="start-btn" type="button">
                Start Game
            </button>

            <button id="pause-btn" type="button" disabled>
                Pause
            </button>

            <button id="restart-btn" type="button">
                Restart
            </button>

        </section>

        <section class="mobile-controls" aria-label="Snake movement controls">

            <button type="button" data-direction="up" aria-label="Move up">↑</button>

            <div class="horizontal-controls">
                <button type="button" data-direction="left" aria-label="Move left">←</button>
                <button type="button" data-direction="down" aria-label="Move down">↓</button>
                <button type="button" data-direction="right" aria-label="Move right">→</button>
            </div>

        </section>

        <footer class="game-footer">
            <p>Use Arrow Keys or WASD to control the snake.</p>
        </footer>

    </main>

</body>

</html>
